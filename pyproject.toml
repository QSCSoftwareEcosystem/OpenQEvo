[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "openqevo"
version = "0.1.0"
description = "Open library for quantum evolution operators — packaging Algorithms Thrust methods into reusable software"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "TBD"}
authors = [
    {name = "QSC Software Thrust"},
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
qiskit = ["qiskit>=1.0"]
pennylane = ["pennylane>=0.35"]
qrack = ["pyqrack>=1.0"]
adapters = [
    "openqevo[qiskit]",
    "openqevo[pennylane]",
]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
    "jsonschema>=4.18",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]

[project.urls]
Repository = "https://github.com/QSCSoftwareThrust/OpenQEvo"
Issues = "https://github.com/QSCSoftwareThrust/OpenQEvo/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
